<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Space Battle logo">
  <!-- A planet with a ring, drawn with basic SVG shapes -->
  <circle cx="32" cy="32" r="30" fill="#0b1226" stroke="#ffbf00" stroke-width="2"/>
  <circle cx="14" cy="16" r="1" fill="#ffffff"/>
  <circle cx="50" cy="12" r="1.2" fill="#ffffff"/>
  <circle cx="52" cy="48" r="1" fill="#ffffff"/>
  <circle cx="11" cy="44" r="0.8" fill="#ffffff"/>
  <circle cx="32" cy="34" r="13" fill="#ffbf00"/>
  <circle cx="27" cy="29" r="4" fill="#ffd866"/>
  <ellipse cx="32" cy="34" rx="24" ry="6" fill="none" stroke="#7fd4ff" stroke-width="2.5" transform="rotate(-20 32 34)"/>
  <!-- Two "laser" lines for the battle -->
  <line x1="6" y1="58" x2="20" y2="46" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="6" x2="46" y2="18" stroke="#7fd4ff" stroke-width="2" stroke-linecap="round"/>
</svg>
