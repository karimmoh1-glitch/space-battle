{% extends "base.html" %}
{% block title %}Projector | Space Battle{% endblock %}
{% block body_class %} class="projector"{% endblock %}
{% block page %}
{% include "_demo_banner.html" %}
<header class="projector-header">
    <div class="projector-title">
        <img src="{{ url_for('static', filename='emblem.svg') }}" alt="">
        <h1>Space Battle</h1>
    </div>
    <div class="projector-controls">
        <span id="live-status" class="status">Connecting</span>
        <span id="last-updated"></span>
        <button class="button" type="button" onclick="document.documentElement.requestFullscreen()">Fullscreen</button>
        <a class="button" href="{{ url_for('home') }}">Exit</a>
    </div>
</header>
<main id="main" class="projector-main">
    <p id="announcer" class="visually-hidden" aria-live="polite"></p>
    <p id="connection-warning" class="warning" role="status" hidden>Connection interrupted. Reconnecting.</p>
    <div id="live-board" class="fill" data-url="{{ url_for('live_display') }}">
        <div class="projector-message"><h2>Connecting</h2></div>
    </div>
</main>
<script src="{{ url_for('static', filename='live.js') }}"></script>
{% endblock %}
