{% extends "base.html" %}
{% block title %}Edit result{% endblock %}

{% block content %}
      <!-- Form elements-->
      <section id="form">
        <form method="post">
          <h2>Edit result #{{ result.id }}</h2>

          <!-- Text -->
          <label for="name">Team name</label>
          <input type="text" id="name" name="name" value="{{ result.name }}" required>

          <!-- Text -->
          <label for="score">Score</label>
          <input type="number" id="score" name="score" value="{{ result.score }}" required>
          <small>Whole numbers only. Can be negative.</small>

          <!-- Buttons -->
          <a href="/ops/{{ path }}" role="button" class="secondary">Cancel</a>
          <input type="submit" value="Save">
        </form>
      </section>
      <!-- ./ Form elements-->
{% endblock %}
