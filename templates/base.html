<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} | Space Battle</title>
    <!-- Pico CSS does all the styling: https://picocss.com -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.cyan.min.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>🚀 Space Battle</strong></li>
            </ul>
            <ul>
                <li><a href="/">Leaderboard</a></li>
                <li><a href="/rules">Rules</a></li>
                <li><a href="/api-guide">API</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% for message in get_flashed_messages() %}
            <article>{{ message }}</article>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>

    <footer class="container">
        <small>Space Battle Tournament · TSA@RHS Webmaster 2026</small>
    </footer>
</body>
</html>
